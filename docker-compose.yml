services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: siksha-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siksha_saathi
    volumes:
      - siksha_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siksha_saathi"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  siksha_pgdata:
    name: siksha_pgdata

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: siksha-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siksha_saathi
    volumes:
      - siksha_pgdata:/var/lib/postgresql/data
      - ./db-scripts/init-schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siksha_saathi"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    mem_limit: 512m
    networks:
      - siksha_network

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: siksha-embedding-service
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      EMBEDDING_HOST: 0.0.0.0
      EMBEDDING_PORT: 8100
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      HF_HOME: /root/.cache/huggingface
    volumes:
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8100/health || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 20
      start_period: 4s
    mem_limit: 1800m
    networks:
      - siksha_network

  ingestion-worker:
    build:
      context: ./optimized-worker
      dockerfile: Dockerfile
    container_name: siksha-ingestion-worker
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/siksha_saathi
      LOCAL_EMBEDDING_URL: http://embedding-service:8100
      EMBEDDING_SERVICE_URL: http://embedding-service:8100
      LOCAL_STORAGE_PATH: /app/.storage
    volumes:
      - storage_data:/app/.storage
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    mem_limit: 1024m
    networks:
      - siksha_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siksha-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/siksha_saathi
      LOCAL_EMBEDDING_URL: http://embedding-service:8100
      LOCAL_STORAGE_PATH: /app/.storage
      NODE_ENV: development
    volumes:
      - storage_data:/app/.storage
      - ./src:/app/src
      - ./public:/app/public
      - ./departments_curriculum.json:/app/departments_curriculum.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    mem_limit: 768m
    networks:
      - siksha_network

volumes:
  siksha_pgdata:
    name: siksha_pgdata
  model_cache:
    name: siksha_model_cache
  storage_data:
    name: siksha_storage_data

networks:
  siksha_network:
    name: siksha_network
